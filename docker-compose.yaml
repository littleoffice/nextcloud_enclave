services:
  caddy:
    image: docker.io/caddy/caddy:alpine@sha256:ef2ad799652965da62f0548e15e00ebcef221dd6f29623d3455df6273ca39f46
    container_name: caddy
    depends_on:
      - nextcloud
      - euro-office-documentserver
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    ports:
      - "443:443"
    networks:
      - whiteboard
      - nextcloud 
      - office
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nextcloud:
    image: docker.io/library/nextcloud:35-apache
    container_name: nextcloud
    env_file: 
      - ./envs/nextcloud.env
    depends_on:
      - nextcloud-postgres
      - nextcloud-redis
      - euro-office-documentserver
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - nextcloud 
      - nextcloud-redis
      - nextcloud-postgres
    volumes:
      - nextcloud_data:/var/www/html
      - nextcloud_config:/var/www/html/config
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./hooks/before-starting/:/docker-entrypoint-hooks.d/before-starting:ro
      - ./hooks/post-installation/:/docker-entrypoint-hooks.d/post-installation:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nextcloud-postgres:
    image: cgr.dev/chainguard/postgres:latest@sha256:833bd9897f70176303e5a9347bdfb4596272176523b3d205dbad93e4adb62227
    container_name: nextcloud-postgres
    env_file: 
      - ./envs/nextcloud-postgres.env
    networks:
      - nextcloud-postgres
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - FSETID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - nextcloud_postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nextcloud-redis:
    image: cgr.dev/chainguard/redis:latest@sha256:a09b265c2968a699b2434d212ad4e4cf550bf8bad32a8ed3a0935b8c805d24b8
    container_name: nextcloud-redis
    networks:
      - nextcloud-redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FSETID
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    entrypoint: ["redis-server"]
    command: ["/etc/redis/redis.conf"]
    volumes:
      - nextcloud_redis_data:/data
      - ./configs/nextcloud-redis.conf:/etc/redis/redis.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
  euro-office-documentserver:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: euro-office-documentserver
    env_file: 
      - ./envs/euro-office-documentserver.env
    depends_on:
      - euro-office-postgres
      - euro-office-rabbitmq
    networks:
      - euro-office_postgres
      - euro-office-rabbitmq
      - office
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - KILL
    security_opt:
      - no-new-privileges:true
    #stdin_open: true
    volumes:
      - euro-office_data:/var/www/euro-office/Data
      - euro-office_log:/var/log/euro-office
      - euro-office_cache:/var/lib/euro-office
      - euro-office_fonts:/usr/share/fonts
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /etc/ssl/certs/ca-certificates.crt:/var/www/euro-office/Data/certs/extra-ca-certs.pem:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
       
  euro-office-rabbitmq:
    image: docker.io/rabbitmq:4
    container_name: euro-office-rabbitmq
    env_file: 
      - ./envs/euro-office-rabbitmq.env
    networks:
      - euro-office-rabbitmq
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/lib/rabbitmq
      - /tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  euro-office-postgres:
    image: cgr.dev/chainguard/postgres:latest@sha256:833bd9897f70176303e5a9347bdfb4596272176523b3d205dbad93e4adb62227
    container_name: euro-office-postgres
    env_file: 
      - ./envs/euro-office-postgres.env
    networks:
      - euro-office_postgres
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - FSETID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - euro-office_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nextcloud-whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:stable@sha256:b60b7633f90d106ac6922f9bc27e1a1ca2442488b740fefdae4c812f34e9cebc
    container_name: nextcloud-whiteboard
    env_file:
      - ./envs/nextcloud-whiteboard.env
    depends_on:
      - nextcloud
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - whiteboard
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nextcloud-postgres:
    internal: true
  nextcloud-redis:
    internal: true
  whiteboard:
    internal: true
  nextcloud:
  office:
  euro-office_postgres:
    internal: true
  euro-office-rabbitmq:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  nextcloud_data:
  nextcloud_config:
  nextcloud_redis_data:
  nextcloud_postgres_data:
  euro-office_log:
  euro-office_data:
  euro-office_cache:
  euro-office_fonts:
  euro-office_postgres_data:

